schema_version: 2
name: setup-medsci
layer: A
owner_domain: environment_setup
maturity: official

when_to_use: "Set up the local environment for MedSci Skills (dependencies, tooling checks)."
when_NOT_to_use: "Installing the skills themselves (use installers/install.py)."

inputs:
  - "local machine state"
outputs:
  - "verified environment / dependency report"
side_effects:
  - none  # read-only diagnostic: runs version/listing commands, installs nothing
downstream_consumers:
  - none
forbidden_actions:
  - installing_upgrading_or_configuring_anything

# v2.1 quality card
purpose: "Check the local toolchain (Python/R/CLI deps, MCP servers) the skills need and report what is missing."
safety_boundaries:
  - "Read-only: reports what is missing and links the setup doc; installs and configures nothing."
  - "Operates locally; does not transmit machine state."
known_limitations:
  - "Environment coverage is best-effort across OSes; some hosts need manual steps."
  - "No standalone demo; an operational utility."
validation_commands:
  - "re-run the setup check and confirm all dependencies report present"
evidence_surface: manual_workflow
