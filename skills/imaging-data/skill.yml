schema_version: 2
name: imaging-data
layer: D
owner_domain: model_validation
maturity: official

when_to_use: "Before any modelling decision on a medical-imaging dataset: (1) profile it — acquisition grid, voxel spacing and orientation spread, intensity domain, label values actually present, foreground fraction and target volume — and gate that profile against the declared plan (a 'test set' with no ground truth, a label grid that does not match its image, a stray label index, accuracy planned against a sliver-sized target, undeclared acquisition heterogeneity); then (2) design or audit the data-preparation stage — DICOM/NIfTI intake, resampling and intensity normalisation, the augmentation plan — as a declarative preprocessing manifest gated for data-stage leakage (a normaliser fit on non-train data, a data-fitted transform run before the split, a patient's slices crossing splits) before model-scaffold builds the training repo, and check a new cohort's intensity domain against the trained normaliser before inference."
when_NOT_to_use: "Tabular/clinical variables (use generate-codebook for the data dictionary, clean-data for cleaning); auditing the train/val/test split table itself, held-out metrics, calibration or subgroup results (use model-assessment); choosing an architecture or vetting a third-party model (use model-selection); scaffolding the training repo or model code (use model-scaffold — it consumes the manifest); LLM/MLLM data handling (use mllm-eval); reimplementing MONAI/TorchIO transforms (out of scope — this skill wires and audits them, never rebuilds them)."

inputs:
  - "image directories in NIfTI (MSD / nnU-Net / AMOS layout: images and labels matched by filename), one --split per partition"
  - "the declared label set (index -> name) and the declared plan: resampling, reorientation, loss family, planned metrics"
  - "data manifest (one row per image/slice with a patient/subject ID) and modality"
  - "intended preprocessing steps (resample spacing, intensity window/normalisation, augmentation plan) and, when available, the split-assignment (patient/subject ID + train/val/test)"
  - "for a new inference cohort: its profile and the trained model's normaliser contract (e.g. nnU-Net plans.json)"
outputs:
  - "dataset-profile JSON eda/profile.json (one record per case: grid, spacing, orientation, intensity percentiles, label values present, foreground fraction, target volume in mL)"
  - "dataset-profile audit JSON qc/dataset_profile.json (deterministic verdicts)"
  - "decision notes for the study record: resampling target, loss/metric family, pre-specified subgroups, held-out provenance, cohort limitations"
  - "a declarative preprocessing manifest preprocessing_manifest.json (transforms with type/fit_scope/stage + split_assignment + split_seed) that model-scaffold consumes, with augmentation-appropriateness and normalisation fit-scope notes"
  - "preprocessing-leakage audit JSON qc/preprocessing_leakage.json and normaliser-domain audit JSON qc/normalizer_domain.json (deterministic) — read by model-scaffold, which refuses on an unacknowledged Major and carries Minor/Flag claims into the repo's IMAGING_QC.md"
deterministic_scripts:
  - scripts/check_dataset_profile.py
  - scripts/check_preprocessing_leakage.py
  - scripts/check_normalizer_domain.py
side_effects:
  - writes_decision_notes
downstream_consumers:
  - model-scaffold
  - model-assessment
  - design-study
  - check-reporting
  - self-review
  - write-paper
forbidden_actions:
  - report_a_profile_figure_not_computed_from_the_files
  - assume_label_indices_or_spacings_instead_of_opening_the_data
  - use_an_unlabelled_split_as_a_held_out_test_set
  - fabricate_image_statistics_or_split_assignments
  - approve_a_pipeline_that_fits_normalisation_on_non_train_data
  - report_a_profile_or_preprocessing_audit_pass_without_running_the_detector
  - reimplement_MONAI_or_TorchIO_transforms
aliases:
  - profile-imaging
  - preprocess-imaging

# v2.1 quality card
purpose: "Establish what a medical-imaging dataset actually is — and what it will not support — before a plan is committed to, then catch data-stage leakage in the preparation pipeline before it silently inflates every downstream metric, so resampling, loss/metric family, pre-specified subgroups and the held-out set rest on measured facts rather than tutorial defaults."
safety_boundaries:
  - "Describe-and-audit only: never modifies, resamples, reorients, splits, or writes image data, and never runs preprocessing on real patient data."
  - "Every profile figure is computed from the files by the profiler; every gate verdict is re-derived by rule and set arithmetic from the profile JSON or the manifest, never asserted from prose."
  - "The gates are stdlib-only, so an audit reproduces anywhere the JSON travels; MONAI / TorchIO transforms are integrated by reference, never reimplemented."
known_limitations:
  - "Profiles the files as they sit on disk: a mislabelled split name or a wrong --declared-labels argument is taken at face value, and DICOM metadata (scanner, vendor, protocol) is not read — vendor/centre subgroups need that metadata from elsewhere."
  - "--spacing-ratio and --imbalance-frac are screening defaults, not published cut-points; they are printed in the output so a reader can see what was applied."
  - "The leakage gate audits the declared manifest, not the executed code; a transform mislabelled in the manifest (e.g. a dataset normaliser tagged fit_scope=sample) can hide a real leak."
  - "Clean data-stage audits are necessary, not sufficient: split disjointness and held-out metric choice (model-assessment) are separate gates."
validation_commands:
  - "python3 scripts/check_dataset_profile.py --profile <profile.json> --strict"
  - "python3 scripts/check_preprocessing_leakage.py --manifest <preprocessing_manifest.json> --strict"
  - "bash scripts/check_dataset_profile_challenge/verify.sh  # deterministic, network-free"
  - "bash scripts/check_preprocessing_leakage_challenge/verify.sh  # deterministic, network-free"
  - "bash scripts/check_normalizer_domain_challenge/verify.sh  # deterministic, network-free"
  - "bash tests/test_dataset_profile.sh"
  - "bash tests/test_preprocessing_leakage.sh"
evidence_surface: ci_validator
