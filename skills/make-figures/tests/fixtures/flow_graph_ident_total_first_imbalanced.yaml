# Source box stating its total first, then its parts: 2,000 - 300 = 1,700, but the screened box
# says 1,650 (off by -50).
rankdir: TB
nodes:
  - {id: ident, label: "Records identified (n = 2,000):\nDatabases (n = 1,800)\nRegisters (n = 200)"}
  - {id: removed, shape: note, label: "Duplicate records removed (n = 300)", rank_same_with: ident}
  - {id: screened, label: "Records screened\n(n = 1,650)"}
edges:
  - {from: ident, to: screened}
  - {from: ident, to: removed, style: dashed, arrow: false, constraint: false}
