# Source box with its parts and a stated total on the last line: 2,000 - 300 = 1,700 closes.
rankdir: TB
nodes:
  - {id: ident, label: "Records identified from:\nDatabases (n = 1,800)\nRegisters (n = 200)\nTotal (n = 2,000)"}
  - {id: removed, shape: note, label: "Duplicate records removed (n = 300)", rank_same_with: ident}
  - {id: screened, label: "Records screened\n(n = 1,700)"}
edges:
  - {from: ident, to: screened}
  - {from: ident, to: removed, style: dashed, arrow: false, constraint: false}
