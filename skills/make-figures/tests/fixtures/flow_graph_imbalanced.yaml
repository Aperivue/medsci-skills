# Synthetic, PII-free generate_flow_diagram.R (nodes/edges) config. The dashed exclusion beside
# 'enrolled' says 500, so the analytic box should read 10,000 - 500 = 9,500; it reads 9,470.
rankdir: TB
nodes:
  - {id: enrolled, label: "Participants enrolled\nN = 10,000"}
  - {id: excl, shape: note, label: "Excluded (n = 500)", rank_same_with: enrolled}
  - {id: cohort, label: "Analytic cohort\nN = 9,470"}
edges:
  - {from: enrolled, to: cohort}
  - {from: enrolled, to: excl, style: dashed, arrow: false, constraint: false}
