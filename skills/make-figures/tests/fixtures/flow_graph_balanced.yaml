# The same nodes/edges cascade, closing exactly: 10,000 - 500 = 9,500.
rankdir: TB
nodes:
  - {id: enrolled, label: "Participants enrolled\nN = 10,000"}
  - {id: excl, shape: note, label: "Excluded (n = 500)", rank_same_with: enrolled}
  - {id: cohort, label: "Analytic cohort\nN = 9,500"}
edges:
  - {from: enrolled, to: cohort}
  - {from: enrolled, to: excl, style: dashed, arrow: false, constraint: false}
