# Correct STROBE cohort: 10,000 - 500 = 9,500; 9,500 - 300 = 9,200 = 4,000 exposed + 5,200 unexposed
nodes:
  - {id: src, label: "Source cohort\nN = 10,000"}
  - {id: x1, shape: note, label: "Excluded: prior cancer\n(n = 500)"}
  - {id: elig, label: "Eligible\nN = 9,500"}
  - {id: x2, shape: note, label: "Excluded: missing exposure data\n(n = 300)"}
  - {id: exp, label: "Exposed\nn = 4,000"}
  - {id: unexp, label: "Unexposed\nn = 5,200"}
edges:
  - {from: src, to: elig}
  - {from: src, to: x1, style: dashed}
  - {from: elig, to: exp}
  - {from: elig, to: unexp}
  - {from: elig, to: x2, style: dashed}
