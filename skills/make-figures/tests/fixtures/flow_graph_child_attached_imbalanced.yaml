# As flow_graph_child_attached.yaml, but 'measured' reads 7,560 although the previous box
# minus its exclusion is 8,000 - 400 = 7,600 (off by 40). 'measured' branches, so the
# subtracted-from convention is not evaluable and only the produced-box convention decides.
rankdir: TB
nodes:
  - {id: source, label: "Source participants\nN = 9,000"}
  - {id: adults, label: "Adults\nN = 8,000"}
  - {id: excl1, shape: note, label: "Excluded (n = 1,000)", rank_same_with: adults}
  - {id: measured, label: "Measured\nN = 7,560"}
  - {id: excl2, shape: note, label: "Excluded (n = 400)", rank_same_with: measured}
  - {id: main, label: "Main analysis\nn = 7,560"}
  - {id: subset, label: "Sensitivity subset\nn = 5,000"}
edges:
  - {from: source, to: adults}
  - {from: adults, to: measured}
  - {from: measured, to: main}
  - {from: measured, to: subset}
  - {from: adults, to: excl1, style: dashed, arrow: false, constraint: false}
  - {from: measured, to: excl2, style: dashed, arrow: false, constraint: false}
