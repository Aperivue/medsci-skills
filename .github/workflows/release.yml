name: Release

# Triggered when a version tag is pushed (e.g., v4.7.0).
# Builds the classroom installer ZIPs (with an injected, verified provenance.json), attests their
# build provenance, verifies they are consumable by the self-updater, creates a GitHub Release with
# the ZIPs attached, and publishes the npm package (idempotently, with npm provenance) so the
# `npx medsci-skills@latest install` channel never drifts behind the GitHub release. Zenodo
# automatically archives the GitHub Release if the integration is enabled at
# https://zenodo.org/account/settings/github/
#
# npm is published through trusted publishing: the job's OIDC token is exchanged for a short-lived
# registry credential, so no npm secret is needed (5.27.0 onward were published this way). The npm
# steps run on the canonical repository only, skip the publish if that version is already on npm,
# and verify that the existing payload matches. They run AFTER the GitHub Release; a later npm
# failure leaves the ZIP release published and requires recovery.
#
# Supply-chain posture (see SECURITY.md "Release integrity & revocation"): the self-updater verifies
# each download's sha256 against the github.com API digest, which detects transport/asset tampering
# only — it does NOT defend against a compromised publisher account. Defenses added here:
#   * a protected `release` environment (configure a required reviewer in repo Settings → Environments
#     so a human approves before any release is published);
#   * least-privilege token scopes;
#   * a preflight that the tagged commit is on `main` and that the Validate workflow passed on it;
#   * a version-consistency gate (CITATION == package.json == manifest == the pushed tag);
#   * build-provenance attestation of the ZIP artifacts;
#   * a post-build check that each ZIP round-trips through the updater's own safe-extract + provenance
#     validation, selected-source byte comparison and existing privacy scanners;
#   * downloaded ZIP byte and npm payload comparison after publication.

on:
  push:
    tags:
      - "v*"
  # Recovery path. A tag can only ever be pushed once, so before this existed a release job that
  # failed after the tag landed could not be retried at all — which is exactly what happened to
  # v5.23.0: the release step errored, the job died before the npm step, and the ZIPs the README
  # sends non-programmers to (releases/latest/download/...) 404'd with no way to republish.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to (re)publish, e.g. v5.23.0"
        required: true
        type: string

# Resolved once so a dispatch run targets the tag it was given and a push run targets the tag that
# triggered it. Every step below reads this, never github.ref_name directly.
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

# Serialize recovery runs for the same tag; never cancel a publication midway.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Least privilege: contents:write to publish the release; id-token + attestations for the build
# provenance attestation; actions:read to read the Validate workflow's result for the release
# commit. Nothing else.
permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Human gate: add a required reviewer to the `release` environment (repo Settings → Environments)
    # so publishing a release requires explicit approval. Harmless before that setting exists.
    environment: release
    env:
      # The npm steps run on the canonical repository only, so a fork cannot try to
      # publish. This deliberately does NOT key off the presence of a secret: under
      # trusted publishing there is no secret, and a guard that reads one would turn
      # "npm was never published" into a green skip. See the assertion after the
      # publish step, which fails the release if npm did not actually receive it.
      NPM_PUBLISH: ${{ github.repository == 'Aperivue/medsci-skills' }}

    steps:
      - name: Checkout repository (with full history for tag annotation)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On a dispatch run the default ref is the branch, not the tag, and the version gate below
          # compares the tag against the CHECKED-OUT manifest — so a republish must check out the tag
          # or it would validate the wrong tree.
          ref: ${{ inputs.tag || github.ref_name }}

      # Verification tools come from the workflow commit, checked out without credentials. The
      # Resolve step below requires the run to be triggered from the tag's own commit, so this is
      # the same tree as the payload; a tag predating these checks is recovered with its own workflow.
      - name: Checkout verification tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Resolve the selected release commit
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          # The ZIP's provenance.json records SOURCE_SHA, but the build-provenance attestation and
          # npm provenance sign the commit the RUN was triggered from (GITHUB_SHA). A recovery run
          # dispatched from main for an older tag would sign main's commit as the source of that
          # tag's payload, as the v5.27.0 recovery did. Dispatch from the tag itself instead.
          if [ "${GITHUB_SHA}" != "$SOURCE_SHA" ]; then
            echo "::error::this run was triggered from ${GITHUB_SHA}, but ${RELEASE_TAG} is ${SOURCE_SHA}; its provenance would name the wrong commit. Re-run from the tag: gh workflow run release.yml --ref ${RELEASE_TAG} -f tag=${RELEASE_TAG}" >&2
            exit 1
          fi
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      # Validate does not run on tag pushes, so nothing else links a published release to a green
      # CI run: a tag on a commit whose Validate run failed, or never ran, would publish. Two checks,
      # both on the exact commit being released:
      #   * it is on main. The git-clone installer and the plugin marketplace read main; a tag cut
      #     from another branch would ship a ZIP and an npm package that main never had.
      #   * every Validate run for it completed with success (that workflow also holds the release
      #     cadence gate, evaluated before this tag existed). A run still in progress is waited for;
      #     a missing, failed or cancelled one fails the release before anything is built.
      - name: Preflight - the release commit is on main and passed Validate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/main; then
            echo "::error::${RELEASE_TAG} (${SOURCE_SHA}) is not on main. Merge it into main, wait for CI on the merge commit, and tag that commit." >&2
            exit 1
          fi
          # Overridable so the regression test can prove that running out of time FAILS.
          WINDOW="${VALIDATE_WAIT_WINDOW:-1800}"
          DEADLINE=$(( $(date +%s) + WINDOW ))
          while :; do
            RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/validate.yml/runs?head_sha=${SOURCE_SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion // "none") \(.html_url)"')"
            if [ -z "$RUNS" ]; then
              echo "::error::no Validate run exists for ${SOURCE_SHA}. Push the commit to main and let CI finish before tagging." >&2
              exit 1
            fi
            BAD="$(printf '%s\n' "$RUNS" | awk '$1 == "completed" && $2 != "success"')"
            if [ -n "$BAD" ]; then
              echo "::error::Validate did not pass on ${SOURCE_SHA}:" >&2
              printf '%s\n' "$BAD" >&2
              exit 1
            fi
            PENDING="$(printf '%s\n' "$RUNS" | awk '$1 != "completed"')"
            [ -z "$PENDING" ] && break
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Validate is still running on ${SOURCE_SHA} after ${WINDOW}s; re-run this release once it has passed:" >&2
              printf '%s\n' "$PENDING" >&2
              exit 1
            fi
            echo "waiting for Validate on ${SOURCE_SHA} ($(( DEADLINE - $(date +%s) ))s left)"
            sleep "${VALIDATE_WAIT_INTERVAL:-30}"
          done
          echo "preflight OK: ${SOURCE_SHA} is on main and every Validate run on it passed:"
          printf '%s\n' "$RUNS"

      # npm documents trusted publishing as requiring Node >= 22.14.0 AND npm >= 11.5.1. Node 24
      # meets the first; the step below guarantees the second whatever npm the image bundles.
      # The tarball is packed by that npm, not by Node, so its contents do not depend on the Node major.
      - name: Set up Node for packing and npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm (trusted publishing needs >= 11.5.1)
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          npm --version

      - name: Install metadata inspection tools
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version-consistency gate (CITATION == package.json == manifest == pushed tag)
        run: |
          set -euo pipefail
          # CITATION == package.json == manifest (three-source version agreement)...
          python3 scripts/check_version_consistency.py
          # ...and the tracked distribution_files.json inventory still matches the on-disk tree, so
          # the inventory the ZIP bundles (which the updater trusts) is anchored to the real source.
          python3 scripts/gen_distribution_manifest.py --check
          TAG="${RELEASE_TAG}"
          VER="${TAG#v}"
          MAN="$(python3 -c 'import json;print(json.load(open("metadata/distribution_manifest.json"))["version"])')"
          if [ "$VER" != "$MAN" ]; then
            echo "::error::pushed tag ${TAG} (version ${VER}) != distribution_manifest version ${MAN}. Bump CITATION.cff/package.json/manifest before tagging." >&2
            exit 1
          fi
          echo "version gate OK: ${TAG} == manifest ${MAN}"

      - name: Build classroom release ZIPs (with verified provenance.json)
        run: |
          set -euo pipefail
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 .release-tools/scripts/build_classroom_release.py --source-root . --output-dir dist \
            --tag "${RELEASE_TAG}" \
            --git-sha "${SOURCE_SHA}" \
            --built-at "${BUILT_AT}"

      - name: Pack the exact npm artifact before publication
        run: |
          set -euo pipefail
          npm pack --json --pack-destination dist > dist/npm-pack.json

      - name: Verify ZIPs are consumable by the self-updater (provenance + safe-extract round-trip)
        run: |
          set -euo pipefail
          for zip in dist/medsci-skills-classroom-*.zip; do
            python3 .release-tools/scripts/check_release_zip.py --zip "$zip" \
              --expect-tag "${RELEASE_TAG}" --require-provenance \
              --expect-sha "${SOURCE_SHA}" --source-root . --privacy \
              --report "${zip%.zip}-verification.json"
          done

      - name: Verify actual npm payload and privacy
        run: |
          set -euo pipefail
          python3 .release-tools/scripts/check_npm_package_contents.py \
            --tarball "dist/medsci-skills-${RELEASE_TAG#v}.tgz" \
            --source-root . --expect-version "${RELEASE_TAG#v}" --privacy \
            --report dist/npm-verification.json

      - name: Attest build provenance of the release ZIPs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/medsci-skills-classroom-*.zip"

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          # Tags are "vX.Y.Z" but CHANGELOG headers are "## [X.Y.Z]" (no leading v).
          # Strip the v so the section is actually found (else notes fall back).
          VER="${TAG#v}"
          # Extract the section for this version from CHANGELOG.md (between this version header and the next version header)
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VER" '
              $0 ~ "^## \\[?"ver"\\]?" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > dist/release-notes.md
          else
            echo "Release ${TAG}" > dist/release-notes.md
          fi

          # Fallback if CHANGELOG section was empty
          if [ ! -s dist/release-notes.md ]; then
            echo "Release ${TAG}" > dist/release-notes.md
            echo "" >> dist/release-notes.md
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." >> dist/release-notes.md
          fi

          # Inspect notes before any preview or public upload; findings never quote values.
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, '.release-tools/scripts')
          from release_payload import privacy
          findings, _ = privacy({'release-notes.md': Path('dist/release-notes.md').read_bytes()})
          if findings:
              raise SystemExit('Release notes failed privacy inspection')
          PY

      - name: Create GitHub Release with classroom ZIP attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publish the SAME classroom artifacts that were verified (above) and attested (above);
        # the glob is identical so a release can only ship a ZIP that round-tripped + was attested.
        # Nothing modifies dist/ between those steps and this upload, so the API sha256 the updater
        # later checks covers exactly the verified bytes.
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          # Create-or-update, never create-or-die. `gh release create` fails outright when a Release
          # object for the tag already exists — which it can, from a partial earlier run or from the
          # tag itself — and that failure killed the whole job BEFORE the npm publish step, leaving
          # the GitHub assets missing AND npm a version behind from one error. Both symptoms, one
          # cause. Uploading with --clobber keeps the invariant the comment above depends on: the
          # bytes attached are the ZIPs that were verified and attested in this same run.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating notes and (re)uploading assets."
            gh release edit "$TAG" \
              --title "MedSci Skills ${TAG}" \
              --notes-file dist/release-notes.md
            gh release upload "$TAG" dist/medsci-skills-classroom-*.zip --clobber
          else
            gh release create "$TAG" \
              --title "MedSci Skills ${TAG}" \
              --notes-file dist/release-notes.md \
              dist/medsci-skills-classroom-*.zip
          fi
          # Assert the outcome rather than the command's exit code: a release that ends with no
          # assets is the exact failure this step exists to prevent, and it looked like success.
          n="$(gh release view "$TAG" --json assets --jq '.assets | length')"
          echo "assets attached to $TAG: $n"
          if [ "$n" -lt 2 ]; then
            echo "::error::release $TAG ended with $n asset(s); expected the 2 classroom ZIPs." >&2
            exit 1
          fi

      - name: Download and compare published ZIPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --pattern 'medsci-skills-classroom-*.zip' \
            --dir dist/downloaded
          for platform in macos windows; do
            asset="medsci-skills-classroom-${platform}.zip"
            python3 .release-tools/scripts/check_release_zip.py \
              --zip "dist/downloaded/$asset" --reference "dist/$asset" \
              --expect-tag "$RELEASE_TAG" --expect-sha "$SOURCE_SHA" \
              --require-provenance --source-root . \
              --report "dist/${platform}-published-verification.json"
          done

      # npm is published from the already inspected tarball. No second pack.
      - name: Publish to npm (idempotent; npm provenance via OIDC)
        if: env.NPM_PUBLISH == 'true'
        env:
          # Legacy fallback only. Publication goes through trusted publishing: when the OIDC
          # exchange succeeds, npm uses that credential in place of this one. Nothing gates on it.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VER="${RELEASE_TAG#v}"
          # Idempotent: re-running a tag must not fail on "version already published".
          if npm view "medsci-skills@${VER}" version >/dev/null 2>&1; then
            echo "medsci-skills@${VER} is already on npm — skipping publish."
            exit 0
          fi
          # --provenance links the published package to this GitHub Actions build via OIDC
          # (uses the id-token permission already granted above).
          npm publish "./dist/medsci-skills-${VER}.tgz" --ignore-scripts --provenance --access public
          echo "Published medsci-skills@${VER} to npm."

      # The step above can end without publishing in more ways than it can with: a
      # skipped `if`, an expired credential, a registry that answers a PUT with 404.
      # v5.27.0 was tagged, released and announced while npm stayed on 5.26.2, because
      # nothing downstream asserted the registry actually carried it. This step runs
      # whenever the publish step was reached at all — skipped or succeeded — and reads
      # the registry rather than the job's own opinion of what it did.
      # npm answers `npm publish` with "Your package is being processed and may take a
      # few minutes to become available", and it means it: on 2026-09-24 the version took
      # 5 min 20 s to appear. The first version of this check read the registry once,
      # immediately, and failed a release whose publish had in fact succeeded - and because
      # it failed, the payload comparison below never ran, so a spurious gate cost a real
      # verification. It waits for propagation now; what it must not do is give up waiting
      # and call that success.
      # Carrying the version is not enough when this is the newest release: `npx
      # medsci-skills@latest` resolves the `latest` dist-tag, and a recovery run that finds the
      # version already published skips the publish without ever looking at it. So for the newest
      # release tag, `latest` must name this version too. An older tag being recovered is exempt:
      # npm refuses to move `latest` backwards on its own, and it must not be moved there.
      - name: npm must actually carry this version
        if: env.NPM_PUBLISH == 'true'
        run: |
          set -uo pipefail
          VER="${RELEASE_TAG#v}"
          NEWEST="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          if [ -z "$NEWEST" ]; then
            echo "::error::could not list the release tags, so whether ${RELEASE_TAG} should be npm's latest is unknown."
            exit 1
          fi
          WANT_LATEST=0
          [ "$NEWEST" = "$RELEASE_TAG" ] && WANT_LATEST=1
          # Overridable so the regression test can prove that running out of time FAILS.
          WINDOW="${NPM_PROPAGATION_WINDOW:-600}"
          DEADLINE=$(( $(date +%s) + WINDOW ))
          while :; do
            PUBLISHED="$(npm view "medsci-skills@${VER}" version 2>/dev/null || true)"
            LATEST="$(npm view medsci-skills dist-tags.latest 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VER" ] && { [ "$WANT_LATEST" = 0 ] || [ "$LATEST" = "$VER" ]; }; then
              break
            fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              if [ "$PUBLISHED" != "$VER" ]; then
                echo "::error::npm still does not carry ${VER} after ${WINDOW}s; registry latest is ${LATEST:-unknown}. The GitHub Release exists, so the channels have diverged: npx medsci-skills@latest installs ${LATEST:-unknown}."
              else
                echo "::error::npm carries ${VER}, but its latest dist-tag is ${LATEST:-unknown} after ${WINDOW}s, and ${RELEASE_TAG} is the newest release: npx medsci-skills@latest installs ${LATEST:-unknown}. Point it with: npm dist-tag add medsci-skills@${VER} latest"
              fi
              exit 1
            fi
            echo "registry: ${VER} published=${PUBLISHED:-no}, latest=${LATEST:-unknown}; retrying ($(( DEADLINE - $(date +%s) ))s left)"
            sleep "${NPM_PROPAGATION_INTERVAL:-30}"
          done
          if [ "$WANT_LATEST" = 1 ]; then
            echo "npm carries ${VER}, and latest points to it."
          else
            echo "npm carries ${VER} (older than ${NEWEST}; latest is ${LATEST:-unknown} and is left alone)."
          fi

      - name: Download and compare published npm payload
        if: env.NPM_PUBLISH == 'true'
        run: |
          set -euo pipefail
          python3 .release-tools/scripts/check_npm_package_contents.py \
            --published-version "${RELEASE_TAG#v}" \
            --reference "dist/medsci-skills-${RELEASE_TAG#v}.tgz" --source-root . \
            --report dist/npm-published-verification.json

      - name: Retain successful verification records
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ env.RELEASE_TAG }}
          path: |
            dist/*-verification.json
          retention-days: 30
