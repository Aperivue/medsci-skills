name: Validate skills (PII + structure)

# Server-side enforcement of validate_skills.sh.
# This catches commits that bypassed the local pre-commit hook
# (--no-verify, different machine, different user) before they reach main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check_release_cadence.py compares CITATION.cff against the newest TAG. A shallow
          # checkout has no tags, and the gate would pass by seeing nothing — the worst kind of
          # green.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test dependencies
        run: pip install pyyaml pandas numpy python-pptx python-docx

      - name: Install exiftool + poppler (EXIF scan + check_asset_anonymization PDF text/metadata)
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl poppler-utils

      - name: "Workflow files parse (a broken one runs ZERO jobs and reports no checks)"
        run: python3 scripts/check_workflow_yaml.py --strict

      - name: "Workflow-yaml gate self-test (a runless step and an unquoted ': ' must both fail)"
        run: bash tests/test_workflow_yaml.sh

      - name: Run run-ci-mirror self-test (the local mirror must enumerate the real gates)
        run: bash tests/test_run_ci_mirror.sh

      - name: Run validate_skills.sh (PII + structure)
        run: bash scripts/validate_skills.sh

      - name: "Validator scope self-test (it must READ every directory it claims to scan)"
        run: bash tests/test_validator_scope.sh

      - name: "Validator --only self-test (a scoped run must not read like a full one)"
        run: bash tests/test_validator_only_flag.sh

      - name: "Run check_frontmatter_scope.py (a manuscript detector must not read YAML front matter as prose)"
        run: python3 scripts/check_frontmatter_scope.py --strict

      - name: "Front-matter scope gate self-test (a new detector cannot join silently)"
        run: bash tests/test_frontmatter_scope.sh

      - name: "Unshipped-rule gate self-test (an instruction we do not ship is not an instruction)"
        run: bash tests/test_personal_rule_refs.sh

      # --- self-update foundation (PR-1a): manifests, version drift, transactional installer ---
      - name: Distribution manifests in sync (gen_distribution_manifest.py --check)
        run: python3 scripts/gen_distribution_manifest.py --check

      - name: Version consistency (CITATION == package.json == distribution_manifest)
        run: python3 scripts/check_version_consistency.py

      - name: Distribution manifest + scope-pinning test
        run: python3 installers/tests/test_distribution_manifest.py

      - name: Transactional installer crash-recovery + legacy-migration test
        run: python3 installers/tests/test_txn.py

      - name: Updater verify / safe-extract / check-update test (offline)
        run: python3 installers/tests/test_update.py

      - name: install.py transactional self-test (no host/state dir touched)
        run: python3 installers/install.py --self-test

      - name: Opt-in SessionStart update-notify hook test (settings merge + hook logic, offline)
        run: python3 installers/tests/test_session_hook.py

      - name: Release-ZIP provenance + updater-consumability round-trip (build -> safe-extract)
        run: bash installers/tests/test_release_zip.sh

      - name: Run validate_routing_assets.py (SKILL.md asset references must exist)
        run: python3 scripts/validate_routing_assets.py --strict

      - name: Run validate_routing_assets.py self-test (dangling references/ pointer fails)
        run: bash tests/test_routing_assets.sh

      - name: "Run check_phase_budget.py (a phase over 80 lines, or a whole SKILL.md over 16k tokens, is a bill paid on every invocation)"
        run: python3 scripts/check_phase_budget.py --strict

      - name: "Run phase-budget self-test (the real 209-line phase must still fail the gate)"
        run: bash tests/test_phase_budget.sh

      - name: "Run check_skill_discovery.py (a fixture under a nested skills/ ships as a real skill)"
        run: python3 scripts/check_skill_discovery.py --strict

      - name: "Run skill-discovery self-test (a nested skills/ must still fail the gate)"
        run: bash tests/test_skill_discovery.sh

      - name: "Run check_named_skills_exist.py (a skill may not send you to a skill that does not exist)"
        run: python3 scripts/check_named_skills_exist.py --strict

      - name: Run check_domain_probe_sync.py (vendored domain probes must be byte-identical)
        run: python3 scripts/check_domain_probe_sync.py --strict

      - name: "Run vendoring-gate self-test (drifted checklist, drifted probe, undeclared pair all fail)"
        run: bash tests/test_vendoring_sync.sh

      - name: "Run check_script_reachability.py (a script no skill runs never runs)"
        run: python3 scripts/check_script_reachability.py --strict

      - name: "Run script-reachability self-test (de-wired script and undocumented allowlist entry fail)"
        run: bash tests/test_script_reachability.sh

      - name: "Run tag-cleanup-gate self-test (both scan backends must reach the same verdict)"
        run: bash tests/test_tag_cleanup_gate.sh

      - name: "Run check_bundled_media_license.py (an MIT package may only ship what it holds — including inside a .pptx)"
        run: python3 scripts/check_bundled_media_license.py --strict

      - name: "Run check_third_party_index.py (the LICENSE must describe the package you downloaded)"
        run: python3 scripts/check_third_party_index.py --strict

      - name: "Run bundled-media + third-party-index self-test (restore each defect; the gate must FAIL)"
        run: bash tests/test_bundled_media_license.sh

      - name: Run validate_capabilities.py (skill-registry consistency, capabilities.yml vs skill.yml)
        run: python3 scripts/validate_capabilities.py --strict

      - name: Run capabilities-validator self-test (drift fixtures fail, live repo clean)
        run: bash tests/test_capabilities_validator.sh

      - name: "Run check_detector_reachability.py (a detector nothing calls never runs)"
        run: python3 scripts/check_detector_reachability.py --strict

      - name: Run check_orchestrate_reachability.py (every skill routable from /orchestrate)
        run: python3 scripts/check_orchestrate_reachability.py --strict

      - name: Run orchestrate-reachability self-test (missing-row + ghost-route fail)
        run: bash tests/test_orchestrate_reachability.sh

      - name: Run check_detector_envelopes.py (every detector's JSON names the detector that wrote it)
        run: python3 scripts/check_detector_envelopes.py --strict

      - name: Run detector-envelope gate self-test (unlabelled + mislabelled envelopes fail)
        run: bash tests/test_detector_envelopes.sh

      - name: Run check_detector_crossfire.py (a fixture clean for one detector must be clean for all)
        run: python3 scripts/check_detector_crossfire.py

      - name: Run detector-crossfire self-test (restores the real 18pt vs 20pt bug; the gate must catch it)
        run: bash tests/test_detector_crossfire.sh

      - name: Run held-out crossfire self-test (the instrument must withhold a rate it cannot support)
        run: bash reverse_engineer/scripts/test_heldout_crossfire.sh

      - name: "Run render_jats fidelity test (a dropped section is not a missing signal, it is a FIRE, biased by publisher)"
        run: bash reverse_engineer/scripts/test_render_jats.sh

      - name: "Run perturbation/invariance self-test (a probe that cannot see a moved verdict is worse than none)"
        run: bash reverse_engineer/scripts/test_perturb_invariance.sh

      - name: "Run held-out acquisition self-test (seal must refuse a corpus that is not what was promised)"
        run: bash reverse_engineer/scripts/test_acquire_heldout.sh

      - name: Run check_python_floor.py (everything a user runs must parse on the Python we promise)
        run: python3 scripts/check_python_floor.py --strict

      - name: Run installer Python-guard test (old / missing Python must be refused, not crash)
        run: bash installers/tests/test_installer_python_guard.sh

      - name: Run setup-check test (hide pandoc; the report must NOTICE, and must install nothing)
        run: bash installers/tests/test_doctor.sh

      - name: Run manifest-drift message test (a contributor's red X must be actionable)
        run: bash tests/test_manifest_drift_message.sh

      - name: Run check_release_cadence.py (a release is an event, not a commit)
        run: python3 scripts/check_release_cadence.py --strict

      - name: Run release-cadence gate self-test
        run: bash tests/test_release_cadence.sh

      - name: "Run release publish-step test (create-or-update; a release with no assets is red)"
        run: bash tests/test_release_publish_step.sh

      - name: Run check_locale_inventory.py (Korean-bearing files must be inventory-justified)
        run: python3 scripts/check_locale_inventory.py

      - name: Run check_locale_inventory.py self-test
        run: bash tests/test_locale_inventory.sh

      - name: "Run check_hardcoded_locale.py (no skill picks its user's language)"
        run: python3 scripts/check_hardcoded_locale.py --strict

      - name: Run hardcoded-locale gate self-test (the rule /publish-skill already wrote down)
        run: bash tests/test_hardcoded_locale.sh

      - name: Run self-review panel-mode structural + PII test
        run: bash skills/self-review/tests/test_panel_mode.sh

      - name: Run self-review reference-adequacy gate test
        run: bash skills/self-review/tests/test_reference_adequacy.sh

      - name: Run self-review editorial-impression gate test (defensiveness counterweight)
        run: bash skills/self-review/tests/test_editorial_impression.sh

      - name: Run self-review rounded-delta gate test (stated diff vs displayed components)
        run: bash skills/self-review/tests/test_rounded_delta.sh

      - name: Run self-review orphan figure/table citation gate test
        run: bash skills/self-review/tests/test_figure_citation.sh

      - name: "Run figure-citation label test (the summary must name the defect it found)"
        run: bash skills/self-review/tests/test_figure_citation_labels.sh

      - name: Run self-review inline-emphasis over-use gate test
        run: bash skills/self-review/tests/test_emphasis_density.sh

      - name: Run humanize rewrite-fidelity gate test (a de-AI pass may not alter a number or drop a citation)
        run: bash skills/humanize/tests/test_rewrite_fidelity.sh

      - name: Run humanize sentence-variety gate test (Fix rule 7 is now measured, not just prescribed)
        run: bash skills/humanize/tests/test_sentence_variety.sh

      - name: Run self-review feature-selection-outside-CV leakage gate test
        run: bash skills/self-review/tests/test_cv_leakage.sh

      - name: Run validate_catalog_consistency.py (doc counts must match disk SSOT)
        run: python3 scripts/validate_catalog_consistency.py

      - name: Run check_frontmatter_schema.py (Agent Skills frontmatter spec — valid YAML, name, description)
        run: python3 scripts/check_frontmatter_schema.py

      - name: Run frontmatter-schema gate self-test
        run: bash tests/test_frontmatter_schema.sh

      - name: Run gen_skill_docs.py --check (per-skill docs must match SKILL.md)
        run: python3 scripts/gen_skill_docs.py --check

      - name: Run gen_skill_docs _ignorable regression test (worktree dotted-ancestor counts)
        run: bash tests/test_gen_skill_docs_ignorable.sh

      - name: Run gen_skills_catalog_json.py --check (storefront catalog SSOT)
        run: python3 scripts/gen_skills_catalog_json.py --check

      - name: Run skills_catalog generator self-test
        run: bash tests/test_skills_catalog_json.sh

      - name: Run gen_marketplace_json.py --check (plugin marketplace SSOT)
        run: python3 scripts/gen_marketplace_json.py --check

      - name: Run marketplace generator self-test
        run: bash tests/test_marketplace_json.sh

      - name: Run gen_detectors_catalog_json.py --check (MedSci-Audit detector SSOT)
        run: python3 scripts/gen_detectors_catalog_json.py --check

      - name: Run detectors_catalog generator self-test
        run: bash tests/test_detectors_catalog_json.sh

      - name: Run sync_hero_skill.py generator self-test (standalone mirror build)
        run: bash tests/test_sync_hero_skill.sh

      - name: Run peer-review self-improvement-claim gate test (self-confirming / ungrounded loop)
        run: bash skills/peer-review/tests/test_self_improvement_claims.sh

      - name: "Run peer-review PDF-scan XMP regression (an int xref must not crash the injection scan)"
        run: bash skills/peer-review/tests/test_scan_pdf_layers_xmp.sh

      - name: "Run peer-review draft gates (length per comment; recommendation must stay in the editor box)"
        run: bash skills/peer-review/tests/test_review_draft_gates.sh

      - name: "Run peer-review request-type challenge (unjustified computation fires; disclosure-led review clears)"
        run: bash skills/peer-review/scripts/check_review_request_types_challenge/verify.sh

      - name: "Run model-sourcing model-provenance challenge (contradictory facts fire; absent facts flagged; full dossier clears)"
        run: bash skills/model-sourcing/scripts/check_model_provenance_challenge/verify.sh

      - name: "Run manage-refs citation-keys challenge (an undefined [@key] fails; a fully-resolved bibliography clears)"
        run: bash skills/manage-refs/scripts/check_citation_keys_challenge/verify.sh

      - name: Run contribute safety gate test (PHI/identifier scan before anything leaves a laptop)
        run: bash skills/contribute/tests/test_contribution_safety.sh

      - name: Run analyze-stats separation gate test (complete / quasi-complete separation)
        run: bash skills/analyze-stats/tests/test_separation.sh

      - name: Run analyze-stats survival template test (A1)
        run: bash skills/analyze-stats/tests/test_survival_template.sh

      - name: Run sync-submission asset-anonymization gate test (A2)
        run: bash skills/sync-submission/tests/test_asset_anonymization.sh

      - name: "Run anonymization config-scan test (the config that draws the figure is a figure source)"
        run: bash skills/sync-submission/tests/test_anonymization_config_scan.sh

      - name: "Run word-count heading-form test (setext and ATX must measure the same manuscript alike)"
        run: bash skills/sync-submission/tests/test_wordcount_heading_forms.sh

      - name: Run sync-submission disclosure/availability detector test
        run: bash skills/sync-submission/tests/test_disclosure_availability.sh

      - name: Run academic-aio summary-box detector test
        run: bash skills/academic-aio/tests/test_summary_box.sh

      - name: Run write-paper title-page affiliation-order test
        run: bash skills/write-paper/tests/test_title_page_affiliations.sh

      - name: Run write-paper backbone full-text readiness gate test
        run: bash skills/write-paper/tests/test_backbone_fulltext.sh

      - name: Run sync-submission cross-artifact staleness gate test (A3)
        run: bash skills/sync-submission/tests/test_cross_artifact_stale.sh

      - name: Run check-reporting checklist-version gate test (A4)
        run: bash skills/check-reporting/tests/test_checklist_version.sh

      - name: Run write-paper placeholder gate test (A5)
        run: bash skills/write-paper/tests/test_placeholders.sh

      - name: Run sync-submission preflight gate test (A6)
        run: bash skills/sync-submission/tests/test_preflight_gate.sh

      - name: "Run sync-submission marked-build failure test (a failed Compare leaves no file behind)"
        run: bash skills/sync-submission/tests/test_marked_build_failure.sh

      - name: "Run sync-submission portal-field-residue challenge (paste-verbatim .txt with markdown -> fires; clean -> clean)"
        run: bash skills/sync-submission/scripts/check_portal_field_residue_challenge/verify.sh

      - name: "Run sync-submission figure portal-readiness challenge (over-cap / wrong-format figure fires; clean -> clean; preflight wiring)"
        run: bash skills/sync-submission/scripts/figure_portal_readiness_challenge/verify.sh

      - name: Run sync-submission word-count-cap gate test (A7)
        run: bash skills/sync-submission/tests/test_wordcount_cap.sh

      - name: Run verify-refs corporate-author gate test (A8)
        run: bash skills/verify-refs/tests/test_corporate_author.sh

      - name: Run verify-refs OpenAlex tertiary-index test (A8b)
        run: bash skills/verify-refs/tests/test_openalex_tier.sh

      - name: Run verify-refs fabricated-author cross-check test
        run: bash skills/verify-refs/tests/test_fabricated_author.sh

      - name: Run verify-refs author-normalization test (Unicode dash + BBT brace-protected surname)
        run: bash skills/verify-refs/tests/test_author_normalization.sh

      - name: "Run verify-refs BibTeX and-others test (a declared et-al is not an author mismatch)"
        run: bash skills/verify-refs/tests/test_bibtex_et_al.sh

      - name: "Run verify-refs last-field test (an entry's final field has no trailing comma)"
        run: bash skills/verify-refs/tests/test_bib_last_field.sh

      - name: "Run verify-refs audit-source test (a committed audit must not carry an absolute path)"
        run: bash skills/verify-refs/tests/test_audit_source_path.sh

      - name: "Run verify-refs claim-fidelity challenge (a real citation carrying a claim its source never makes)"
        run: bash skills/verify-refs/scripts/claim_fidelity_challenge/verify.sh

      - name: Run manage-refs bib-title publisher-markup gate test
        run: bash skills/manage-refs/tests/test_bib_title_markup.sh

      - name: Run revise response-claim verification gate test
        run: bash skills/revise/tests/test_response_claims.sh

      - name: "Run revise density-complaint challenge (point-by-point revision that got longer must fail)"
        run: bash skills/revise/scripts/density_complaint_challenge/verify.sh

      - name: Run sync-submission marked-manuscript round-trip gate test (move-aware)
        run: bash skills/sync-submission/tests/test_marked_manuscript.sh

      - name: Run find-cohort-gap local-codebook input adapter test
        run: bash skills/find-cohort-gap/tests/test_cohort_profile.sh

      - name: Run self-review parenthesis-span corruption gate test (A9)
        run: bash skills/self-review/tests/test_paren_spans.sh

      - name: Run self-review classical-style gate test (A10)
        run: bash skills/self-review/tests/test_classical_style.sh

      - name: Run self-review confounding-completeness gate test (A11)
        run: bash skills/self-review/tests/test_confounding_completeness.sh

      - name: Run self-review supplement-hygiene gate test
        run: bash skills/self-review/tests/test_supplement_hygiene.sh

      - name: Run self-review artifact-coverage gate test
        run: bash skills/self-review/tests/test_artifact_coverage.sh

      - name: Run self-review null-calibration gate test
