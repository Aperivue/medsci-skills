        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/check-reporting/tests/test_framework_naming.sh

      - name: "Run check-reporting checklist-fidelity gate test (a checklist must match the official inventory, issue #352)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/check-reporting/tests/test_checklist_fidelity.sh

      - name: Run check-reporting PRISMA-cascade test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/check-reporting/tests/test_prisma_cascade.sh

      - name: Run check-reporting PRISMA Figure 1 audit test (Step 4d)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/check-reporting/tests/test_prisma_figure.sh

      - name: Run manage-refs duplicate-bibliography gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/manage-refs/tests/test_reference_duplication.sh

      - name: "Run self-review confounding findings-contract challenge (a status row is not a finding)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/scripts/confounding_findings_challenge/verify.sh

      - name: "Run self-review cohort-arithmetic binding challenge (a label digit is not an event count)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/scripts/cohort_arith_binding_challenge/verify.sh

      - name: "Run self-review AI-disclosure placement challenge (the journals disagree; the target decides)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/scripts/disclosure_placement_challenge/verify.sh

      - name: Run self-review binning-consistency gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_binning_consistency.sh

      - name: Run self-review float citation-order gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_citation_order.sh

      - name: Run self-review aphorism-density gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_aphorism_density.sh

      - name: Run self-review rhetorical-density gate test (antithesis + cleft, humanize P27)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_rhetorical_density.sh

      - name: Run self-review claim-artifact (estimand provenance) gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_claim_artifact.sh

      - name: Run self-review panel-diversity gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_panel_diversity.sh

      - name: Run self-review reviewer-team-consistency gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/self-review/tests/test_reviewer_team_consistency.sh

      - name: "Run sync-submission CRediT-integrity challenge (a taxonomy term with nothing behind it)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/scripts/credit_integrity_challenge/verify.sh

      - name: "Run sync-submission portal-mirror challenge (a declaration that never reaches the field that replaces it)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/scripts/portal_mirror_challenge/verify.sh

      - name: Run sync-submission audit-dump leak gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/tests/test_checklist_dump_leak.sh

      - name: Run sync-submission copy-divergence gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/tests/test_copy_divergence.sh

      - name: Run sync-submission cross-document-N gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/tests/test_cross_document_n.sh

      - name: Run sync-submission scope-drift gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/tests/test_scope_drift.sh

      - name: Run sync-submission cover-letter title-drift gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/tests/test_cover_letter_title_drift.sh

      - name: Run sync-submission vN-docx assertion gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/sync-submission/tests/test_vN_docx_assertion.sh

      - name: Run verify-refs pagination-placeholder gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/verify-refs/tests/test_pagination_placeholder.sh

      # --- Tests that shipped on disk but no workflow ran. check_test_wiring.py below is what
      #     keeps this list from growing again by omission; these twelve were the standing backlog
      #     it found on 2026-07-25 (six of them declared in a skill.yml CI never reads).
      - name: "Run design-study adjustment-set challenge"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/design-study/scripts/adjustment_set_challenge/verify.sh

      - name: "Run find-journal acceptance-readiness challenge"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/find-journal/scripts/acceptance_readiness_challenge/verify.sh

      - name: "Run make-figures portal-TIFF export challenge"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/make-figures/scripts/export_portal_tiff_challenge/verify.sh

      - name: "Run make-figures core-figure render challenge"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/make-figures/scripts/render_core_figures_challenge/verify.sh

      - name: "Run meta-analysis extraction-assist challenge"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/meta-analysis/scripts/extract_assist_challenge/verify.sh

      - name: "Run search-lit snowball challenge"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/search-lit/references/snowball_challenge/verify.sh

      - name: "Run search-lit E-utilities test (an apostrophe in a query is data, not code)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/search-lit/tests/test_pubmed_eutils.sh

      - name: "Run search-lit parse_pubmed test (inline markup never truncates a title or abstract)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/search-lit/tests/test_parse_pubmed.sh

      - name: "Run ma-scout test (an unknown esearch count is never 0; an unchecked PROSPERO is never clear)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/ma-scout/tests/test_esearch_count_and_prospero.sh

      - name: "Run DOI-record-match challenge (a resolvable DOI can belong to a different paper)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/search-lit/scripts/check_doi_record_match_challenge/verify.sh

      - name: Run meta-analysis screening-reconcile test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/meta-analysis/tests/test_screening_reconcile.sh

      - name: Run model-selection model-provenance test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash skills/model-selection/tests/test_model_provenance.sh

      - name: Run present-paper backup-off-the-clock test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 skills/present-paper/tests/test_backup_off_the_clock.py

      - name: Run present-paper markdown-parity test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 skills/present-paper/tests/test_md_parity.py

      - name: Run Phase-1a gate test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/test_phase1a_gates.sh

      - name: Run Phase-1c hook test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/test_phase1c_hooks.sh

      - name: "Run check_test_wiring.py (a test CI never runs is a test that never runs)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 scripts/check_test_wiring.py

      - name: "Run test-wiring gate self-test (restore the real omission; the gate must FAIL)"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/test_test_wiring.sh

      - name: Verify demo manifest.lock files (reproducibility lock)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          # All five demos. Demos 4 and 5 were added late: on 2026-08-01 demo/04's lock was
          # found stale in main — its reference_audit.json had been edited after the lock was
          # built — which is exactly the drift a reproducibility lock exists to catch and which
          # nothing was checking, because the loop stopped at demo 3.
          for d in demo/01_wisconsin_bc demo/02_metafor_bcg demo/03_nhanes_obesity \
                   demo/04_pneumoniamnist_cnn demo/05_msd_amos_spleen; do
            python3 skills/version-dataset/scripts/version_dataset.py verify \
              --manifest "$d/manifest.lock.json" --base "$d" --strict
          done

      # --- npm/npx distribution baseline (runs last so packaging failures are easy to isolate) ---
      - name: Set up Node
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm package self-test (CLI shim + exec bit + version sync + pack audit)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/test_npm_package.sh

      - name: npm pack content audit (real pack, package/ prefix normalized)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 scripts/check_npm_package_contents.py --real --privacy

      # --- distribution manifest: last on purpose ---
      # These four fail whenever a change adds or edits a shipped file without regenerating
      # metadata/, which is the normal state of a first contribution (CONTRIBUTING: "One check
      # may go red"). A job stops at its first failing step, so while they ran early a contributor
      # saw that one red step and none of the gates after it. Here they still fail the job, after
      # every other gate has reported.
      - name: Distribution manifests in sync (gen_distribution_manifest.py --check)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 scripts/gen_distribution_manifest.py --check

      - name: Distribution manifest + scope-pinning test
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: python3 installers/tests/test_distribution_manifest.py

      - name: Release-ZIP provenance + updater-consumability round-trip (build -> safe-extract)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          bash installers/tests/test_release_zip.sh
          python3 tests/test_release_payloads.py

      - name: Run manifest-drift message test (a contributor's red X must be actionable)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bash tests/test_manifest_drift_message.sh

  # Cross-platform safety for the transactional installer + updater (PR-1a/PR-1b). Ubuntu-only CI
  # cannot assert macOS/Windows path/journal/os.replace/extraction behavior; this matrix runs the
  # crash-recovery + legacy-migration tests, the updater verify/safe-extract tests, and the
  # transactional self-test on macOS + Windows (Ubuntu is covered by the `validate` job). Hash-based
  # manifest --check stays Ubuntu-only — it is sensitive to checkout line endings, not OS behavior.
  foundation-os:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Transactional installer crash-recovery + legacy-migration test
        run: python installers/tests/test_txn.py
      - name: "v5 -> v6 upgrade test (the upgrade a macOS or Windows user runs, not only Ubuntu's)"
        run: python installers/tests/test_v6_upgrade.py
      - name: Updater verify / safe-extract / check-update test (offline)
        run: python installers/tests/test_update.py
      - name: Opt-in SessionStart update-notify hook test (settings merge + hook logic)
        run: python installers/tests/test_session_hook.py
      - name: Opt-in CLAUDE.md routing block test
        run: python installers/tests/test_routing.py
      - name: Cursor project-rule test
        run: python installers/tests/test_cursor_rule.py
      - name: install.py transactional self-test
        run: python installers/install.py --self-test

  # The installer runs on whatever `python3` the user has, and stock macOS ships 3.9, the floor the
  # README promises. `check_python_floor.py` in the validate job parses every user-facing file under
  # 3.9 grammar, but parsing is not running: only a 3.9 interpreter executes the installer's code
  # paths (extraction, journal recovery, settings merge) the way that user's machine will. No
  # third-party packages are installed, because the installer must not need any.
  python-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9 (the promised floor)
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Transactional installer crash-recovery + legacy-migration test (3.9)
        run: python installers/tests/test_txn.py
      - name: v5 -> v6 upgrade test (3.9)
        run: python installers/tests/test_v6_upgrade.py
      - name: Updater verify / safe-extract / check-update test (3.9)
        run: python installers/tests/test_update.py
      - name: SessionStart update-notify hook test (3.9)
        run: python installers/tests/test_session_hook.py
      - name: CLAUDE.md routing block test (3.9)
        run: python installers/tests/test_routing.py
      - name: Cursor project-rule test (3.9)
        run: python installers/tests/test_cursor_rule.py
      - name: install.py transactional self-test (3.9)
        run: python installers/install.py --self-test
