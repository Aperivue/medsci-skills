      - name: Run self-review nested-group-comparison challenge (subset vs parent cohort)
        run: bash skills/self-review/scripts/check_nested_group_comparison_challenge/verify.sh

      - name: Run self-review reported-P-from-counts challenge (recompute row P, stdlib)
        run: bash skills/self-review/scripts/check_reported_p_from_counts_challenge/verify.sh

      - name: Run self-review DTA-denominator challenge (sens/spec vs reference-standard)
        run: bash skills/self-review/scripts/check_dta_denominators_challenge/verify.sh

